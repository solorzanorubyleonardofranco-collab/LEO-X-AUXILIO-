<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CREADOR LEO X</title>
    <style>
        :root {
            --primary: #ff0000;
            --bg-dark: #050000;
            --panel-bg: rgba(15, 0, 0, 0.95);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            /* Soporte para Notch en iOS */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .panel {
            width: 90%;
            max-width: 380px;
            background: var(--panel-bg);
            border: 2px solid var(--primary);
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            background: rgba(255, 0, 0, 0.2);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--primary);
        }

        .header span { color: var(--primary); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        .content { display: flex; height: 380px; }

        .sidebar {
            width: 70px;
            border-right: 1px solid rgba(255, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            gap: 25px;
            background: rgba(0,0,0,0.3);
        }

        .sidebar-icon { 
            font-size: 24px; 
            cursor: pointer; 
            opacity: 0.3; 
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        
        .sidebar-icon.active { 
            opacity: 1; 
            transform: scale(1.2);
            filter: drop-shadow(0 0 8px var(--primary)); 
        }

        .options { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; /* Scroll suave en iOS */
        }

        .option-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 18px; 
        }

        .option-item span { font-size: 14px; font-weight: 500; text-transform: uppercase; }
        
        .fov-container { margin-top: 15px; padding: 12px; background: rgba(255,0,0,0.1); border-radius: 10px; }
        
        .fov-range { 
            width: 100%; 
            accent-color: var(--primary); 
            height: 6px;
            margin-top: 10px;
        }

        .btn-inject {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(255,0,0,0.3);
            active: transform: scale(0.98);
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            border-left: 3px solid #00ff00;
        }

        .dot-green { 
            height: 10px; width: 10px; 
            background: #00ff00; 
            border-radius: 50%; 
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .console {
            background: #000;
            border-radius: 8px;
            padding: 12px;
            height: 120px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #ff4444;
            overflow-y: auto;
            border: 1px solid rgba(255, 0, 0, 0.3);
            display: none;
        }

        .game-footer {
            padding: 15px;
            display: none; 
            gap: 10px;
            background: rgba(0,0,0,0.5);
        }

        .btn-launch {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--primary);
            color: white;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-launch:active { background: var(--primary); }

        /* Switches Estilo Moderno */
        .switch { position: relative; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { 
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; 
            background: #333; transition: .4s; border-radius: 20px; 
        }
        .slider:before { 
            position: absolute; content: ""; height: 16px; width: 16px; 
            left: 3px; bottom: 3px; background: white; transition: .4s; border-radius: 50%; 
        }
        input:checked + .slider { background: var(--primary); }
        input:checked + .slider:before { transform: translateX(18px); }
    </style>
</head>
<body>

<div class="panel">
    <div class="header">
        <span>CREADOR LEO X</span>
        <span onclick="window.location.reload()" style="cursor:pointer">✕</span>
    </div>

    <div class="content">
        <div class="sidebar">
            <div class="sidebar-icon active" onclick="tab('tab1', event)">🍓</div>
            <div class="sidebar-icon" onclick="tab('tab2', event)">🍓</div>
            <div class="sidebar-icon" onclick="tab('tab3', event)">🍓</div>
            <div class="sidebar-icon" onclick="tab('tab4', event)">🍓</div>
        </div>

        <div class="options">
            <div id="tab1" class="tab-content">
                <div class="option-item"><span>AIMBOT LEGIT</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
                <div class="option-item"><span>ALTA PRECISIÓN</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
                <div class="fov-container">
                    <div style="display:flex; justify-content:space-between; font-size:13px;"><span>Aimfov Range</span><span id="fov-val">1</span></div>
                    <input type="range" class="fov-range" min="1" max="100" value="1" oninput="document.getElementById('fov-val').innerText=this.value">
                </div>
            </div>

            <div id="tab2" class="tab-content" style="display:none">
                <div class="option-item"><span>Aimlock</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
                <div class="option-item"><span>No RECOIL</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
                <div class="option-item"><span>Bypass Anti-Ban</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
            </div>

            <div id="tab3" class="tab-content" style="display:none">
                <div class="option-item"><span>Regedit legit</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
                <div class="option-item"><span>Auto-Headshot</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
                <div class="option-item"><span>Optimizar Ping</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
            </div>

            <div id="tab4" class="tab-content" style="display:none">
                <button class="btn-inject" id="btn-start" onclick="startInjected()">🍓 INYECTAR SCRIPT</button>
                <div class="status-bar" id="status-box">
                    <div class="dot-green"></div>
                    <span style="font-size: 13px;">PROCESANDO DATOS...</span>
                </div>
                <div class="console" id="log-box"></div>
            </div>
        </div>
    </div>

    <div class="game-footer" id="game-btns">
        <button class="btn-launch" onclick="abrirGame('normal')">ABRIR FF</button>
        <button class="btn-launch" onclick="abrirGame('max')">ABRIR MAX</button>
    </div>
</div>

<script>
    function tab(id, event) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.getElementById(id).style.display = 'block';
        document.querySelectorAll('.sidebar-icon').forEach(i => i.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    function startInjected() {
        const btn = document.getElementById('btn-start');
        const status = document.getElementById('status-box');
        const log = document.getElementById('log-box');
        const footer = document.getElementById('game-btns');

        btn.style.display = 'none';
        status.style.display = 'flex';
        log.style.display = 'block';

        const scripts = [
            "> Conectando al servidor...",
            "> Bypass activado correctamente.",
            "> Inyectando Regedit 2024...",
            "> Aplicando Aimfov dinámico...",
            "> Proceso completado con éxito 🍓"
        ];

        let i = 0;
        const interval = setInterval(() => {
            if(i < scripts.length) {
                log.innerHTML += scripts[i] + "<br>";
                log.scrollTop = log.scrollHeight;
                i++;
            } else {
                clearInterval(interval);
                document.querySelector('.status-bar span').innerText = "LISTO PARA JUGAR";
                footer.style.display = 'flex';
            }
        }, 1000);
    }

    function abrirGame(tipo) {
        const pkg = (tipo === 'normal') ? 'com.dts.freefireth' : 'com.dts.freefiremax';
        const scheme = (tipo === 'normal') ? 'freefireth://' : 'freefiremax://';

        // Detectar si es iOS o Android
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        if (isIOS) {
            // En iOS intentamos abrir por esquema
            window.location.href = scheme;
            setTimeout(() => {
                alert("Si el juego no abrió, asegúrate de tenerlo instalado.");
            }, 2500);
        } else {
            // En Android usamos el Intent de Google Chrome
            window.location.href = `intent://#Intent;scheme=${tipo === 'normal' ? 'freefireth' : 'freefiremax'};package=${pkg};end`;
        }
    }
</script>
